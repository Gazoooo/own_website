# Portable website service; shared ingress uses the existing external network.
name: site-01
services:
  web:
    restart: unless-stopped
    read_only: true
    user: 101:101
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=32m,mode=1777,noexec,nosuid
    mem_limit: 64m
    pids_limit: 32
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 $$(cat /tmp/nginx.pid) && nginx -t
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
    image: local/site-01:20261031
    networks:
      web:
        aliases:
        - site-01
    volumes:
    - type: bind
      source: ./html
      target: /usr/share/nginx/html
      read_only: true
      bind:
        create_host_path: false
    build:
      context: .
networks:
  web:
    external: true
    name: homelab-static-web
